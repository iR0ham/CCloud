name: ccloud
description: "CCloud movie, series and live TV player for Android, Windows and macOS."
publish_to: 'none'
version: 2.0.0+22

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.2.0
  crypto: ^3.0.7
  path_provider: ^2.1.4
  shared_preferences: ^2.3.0
  cached_network_image: ^3.3.0
  media_kit: ^1.1.10
  media_kit_video: ^1.2.0
  media_kit_libs_android_video: ^1.3.5
  media_kit_libs_windows_video: ^1.0.11
  wakelock_plus: ^1.2.0
  url_launcher: ^6.3.0
  window_manager: ^0.6.0
  package_info_plus: ^10.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Test-only, and already in the resolution graph through `shared_preferences`. Naming it here is what lets
  # `test/live_catalog_store_test.dart` install a storage implementation that *refuses* a write or a removal:
  # the plugin's own in-memory double always succeeds, so without this seam the rule "a save proves the write
  # took" would be untested on this port while it is tested on webOS and macOS. No app code imports it and it
  # ships in no artefact.
  shared_preferences_platform_interface: ^2.4.1

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/legal/
    - assets/legal/Legal/
    - assets/legal/Legal/licenses/
  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/vazirmatn_regular.ttf
          weight: 400
        - asset: assets/fonts/vazirmatn_medium.ttf
          weight: 500
        - asset: assets/fonts/vazirmatn_semibold.ttf
          weight: 600
        - asset: assets/fonts/vazirmatn_bold.ttf
          weight: 700
        - asset: assets/fonts/vazirmatn_black.ttf
          weight: 900
