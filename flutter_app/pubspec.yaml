name: ccloud
description: "CCloud movie, series and live TV player for Android, Windows and macOS."
publish_to: 'none'
version: 2.0.0+22

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.2.0
  crypto: ^3.0.7
  path_provider: ^2.1.4
  shared_preferences: ^2.3.0
  cached_network_image: ^3.3.0
  media_kit: ^1.1.10
  media_kit_video: ^1.2.0
  media_kit_libs_android_video: ^1.3.5
  media_kit_libs_windows_video: ^1.0.11
  wakelock_plus: ^1.2.0
  url_launcher: ^6.3.0
  window_manager: ^0.6.0
  package_info_plus: ^10.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/legal/
    - assets/legal/Legal/
    - assets/legal/Legal/licenses/
  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/vazirmatn_regular.ttf
          weight: 400
        - asset: assets/fonts/vazirmatn_medium.ttf
          weight: 500
        - asset: assets/fonts/vazirmatn_semibold.ttf
          weight: 600
        - asset: assets/fonts/vazirmatn_bold.ttf
          weight: 700
        - asset: assets/fonts/vazirmatn_black.ttf
          weight: 900
