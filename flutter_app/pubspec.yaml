name: ccloud
description: "CCloud for Android phone, tablet and Android TV."
publish_to: 'none'
version: 1.0.5+6

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.2.0
  shared_preferences: ^2.3.0
  cached_network_image: ^3.3.0
  media_kit: ^1.1.10
  media_kit_video: ^1.2.0
  media_kit_libs_android_video: ^1.3.5
  wakelock_plus: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/vazirmatn_regular.ttf
          weight: 400
        - asset: assets/fonts/vazirmatn_medium.ttf
          weight: 500
        - asset: assets/fonts/vazirmatn_semibold.ttf
          weight: 600
        - asset: assets/fonts/vazirmatn_bold.ttf
          weight: 700
        - asset: assets/fonts/vazirmatn_black.ttf
          weight: 900
