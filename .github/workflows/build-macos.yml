name: Build macOS

# Reusable macOS arm64 build. Ad-hoc signing is the default; Developer ID
# signing and notarization happen only when the secrets below are configured.
on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to check out; defaults to the caller's ref
        required: false
        type: string
        default: ''
      ui_smoke:
        description: Run hosted UI smoke + snapshots (mandatory when enabled)
        required: false
        type: boolean
        default: false
    secrets:
      MACOS_CERTIFICATE_P12:
        required: false
      MACOS_CERTIFICATE_PASSWORD:
        required: false
      MACOS_KEYCHAIN_PASSWORD:
        required: false
      MACOS_SIGNING_IDENTITY:
        required: false
      MACOS_NOTARY_APPLE_ID:
        required: false
      MACOS_NOTARY_TEAM_ID:
        required: false
      MACOS_NOTARY_PASSWORD:
        required: false
    outputs:
      signing:
        description: ad-hoc, developer-id-not-notarized, or developer-id-notarized
        value: ${{ jobs.build.outputs.signing }}
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to check out; defaults to the selected branch/tag
        required: false
        type: string
        default: ''
      ui_smoke:
        description: Run hosted UI smoke + snapshots (mandatory when enabled)
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-macos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: macOS arm64 build
    runs-on: macos-15
    timeout-minutes: 60
    outputs:
      signing: ${{ steps.signing_label.outputs.label }}
    env:
      # Secret names/formats (documented here; values are never committed):
      #   MACOS_CERTIFICATE_P12: base64 of a .p12 containing the Developer ID
      #     Application certificate and its private key
      #   MACOS_CERTIFICATE_PASSWORD: password for that .p12
      #   MACOS_KEYCHAIN_PASSWORD: arbitrary password for the temporary keychain
      #   MACOS_SIGNING_IDENTITY: full codesign identity, e.g.
      #     "Developer ID Application: Name (TEAMID)"
      #   MACOS_NOTARY_APPLE_ID: Apple ID email used by notarytool
      #   MACOS_NOTARY_TEAM_ID: 10-character Apple team ID
      #   MACOS_NOTARY_PASSWORD: app-specific password for notarytool
      MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
      MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
      MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
      MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
      MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: Assert arm64 runner
        run: |
          ARCH="$(uname -m)"
          echo "runner arch: $ARCH"
          test "$ARCH" = "arm64"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Sync and validate canonical version
        id: version
        run: |
          python3 scripts/version.py sync
          python3 scripts/version.py check
          VERSION="$(python3 scripts/version.py show | python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])')"
          BUILD="$(python3 scripts/version.py show | python3 -c 'import json,sys; print(json.load(sys.stdin)["build"])')"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
      - name: Install FFmpeg (Homebrew)
        run: brew install ffmpeg
      - name: Bundle self-contained FFmpeg
        run: ./scripts/bundle_ffmpeg.sh
      - name: Typecheck Swift sources
        run: ./scripts/typecheck.sh
      - name: Build CCloud.app (ad-hoc)
        run: ./build.sh
      - name: Determine signing mode
        id: signing
        run: |
          if [ -n "$MACOS_CERTIFICATE_P12" ]; then
            echo "mode=developer-id" >> "$GITHUB_OUTPUT"
            echo "Developer ID secrets present; the app will be signed and notarized."
          else
            echo "mode=ad-hoc" >> "$GITHUB_OUTPUT"
            echo "::notice::Developer ID secrets absent; macOS artifact is ad-hoc signed, not notarized, and not a production-signed artifact."
          fi
      - name: Sign and notarize with Developer ID
        id: notarize
        if: steps.signing.outputs.mode == 'developer-id'
        run: |
          set -euo pipefail
          CERT="$RUNNER_TEMP/ccloud-developer-id.p12"
          KEYCHAIN="$RUNNER_TEMP/ccloud-signing.keychain-db"
          # Remove the decoded certificate on every exit path, including a
          # failed notarization, so signing material cannot outlive the step.
          trap 'rm -f "$CERT"' EXIT
          echo "$MACOS_CERTIFICATE_P12" | base64 -D > "$CERT"
          security create-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT" -k "$KEYCHAIN" -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" \
            "$HOME/Library/Keychains/login.keychain-db"
          codesign --force --deep --options runtime --timestamp \
            --sign "$MACOS_SIGNING_IDENTITY" build/CCloud.app
          codesign --verify --deep --strict --verbose=2 build/CCloud.app
          ditto -c -k --keepParent build/CCloud.app "$RUNNER_TEMP/CCloud-notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/CCloud-notarize.zip" \
            --apple-id "$MACOS_NOTARY_APPLE_ID" \
            --team-id "$MACOS_NOTARY_TEAM_ID" \
            --password "$MACOS_NOTARY_PASSWORD" \
            --wait
          xcrun stapler staple build/CCloud.app
          xcrun stapler validate build/CCloud.app
          rm -f "$CERT"
      - name: Record signing label
        id: signing_label
        if: always()
        run: |
          if [ "${{ steps.notarize.outcome }}" = "success" ]; then
            echo "label=developer-id-notarized" >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.signing.outputs.mode }}" = "developer-id" ]; then
            echo "label=developer-id-not-notarized" >> "$GITHUB_OUTPUT"
          else
            echo "label=ad-hoc" >> "$GITHUB_OUTPUT"
          fi
      - name: Remove temporary signing keychain
        if: always() && steps.signing.outputs.mode == 'developer-id'
        run: security delete-keychain "$RUNNER_TEMP/ccloud-signing.keychain-db" || true
      - name: Package macOS ZIP and checksums
        run: ./scripts/make_dist.sh
      - name: Hosted UI smoke and snapshots (mandatory when enabled)
        if: inputs.ui_smoke
        run: |
          ./Tests/player/run.sh
          ./scripts/qa_smoke.sh
          ./scripts/qa_snapshots.sh
      - name: Upload UI evidence
        if: always() && inputs.ui_smoke
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macOS-ui-evidence-${{ steps.version.outputs.version }}-${{ steps.version.outputs.build }}
          path: qa/
          if-no-files-found: warn
      - name: Stage macOS release artifacts
        run: |
          STAGE="$RUNNER_TEMP/release-staging/macos"
          mkdir -p "$STAGE"
          cp dist/CCloud-macOS-*.zip "$STAGE/"
          cp dist/CCloud-macOS-*.sha256 "$STAGE/"
          cp dist/SHA256SUMS.txt "$STAGE/SHA256SUMS-macOS.txt"
          printf '%s\n' "${{ steps.signing_label.outputs.label }}" > "$STAGE/SIGNING-macOS.txt"
          cat "$STAGE/SIGNING-macOS.txt"
      - name: Upload macOS release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-macOS-${{ steps.version.outputs.version }}-${{ steps.version.outputs.build }}
          path: ${{ runner.temp }}/release-staging/macos/
          if-no-files-found: error
      - name: Publish signing summary
        run: |
          echo "### macOS artifact signing: ${{ steps.signing_label.outputs.label }}" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.signing_label.outputs.label }}" = "ad-hoc" ]; then
            echo "Ad-hoc signed only; not notarized and not a production release." >> "$GITHUB_STEP_SUMMARY"
          fi
