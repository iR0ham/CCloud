name: Build Windows

# Windows builds cannot be cross-compiled from macOS, so they run on a Windows
# runner. There is no release/publish step here: this workflow only produces
# artifacts; release publication is owned by release.yml.
on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to check out; defaults to the caller's ref
        required: false
        type: string
        default: ''
    outputs:
      installer:
        description: true when an Inno Setup installer was produced
        value: ${{ jobs.build-windows.outputs.installer }}
      signing:
        description: Windows Authenticode signing status (currently unsigned)
        value: ${{ jobs.build-windows.outputs.signing }}
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to check out; defaults to the selected branch/tag
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analyze:
    name: Dart analyze
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.8'
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

  build-windows:
    name: Windows release build
    runs-on: windows-latest
    timeout-minutes: 60
    # The installer is best effort (a runner without Inno Setup must not fail a
    # build), so the install test needs to know whether an installer exists at
    # all instead of failing on a missing artifact.
    outputs:
      installer: ${{ steps.installer.outputs.created }}
      signing: ${{ steps.signing.outputs.label }}
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.8'
          cache: true

      - name: Read canonical version and sync metadata
        id: version
        working-directory: .
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python scripts/version.py sync
          if ($LASTEXITCODE -ne 0) { throw "version sync failed" }
          python scripts/version.py check
          if ($LASTEXITCODE -ne 0) { throw "version check failed" }
          $raw = python scripts/version.py show
          if ($LASTEXITCODE -ne 0) { throw "version show failed" }
          $version = $raw | ConvertFrom-Json
          "version=$($version.version)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "build=$($version.build)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Canonical version: $($version.version) build $($version.build)"

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Resolve dependencies
        run: flutter pub get

      # The first run downloads the prebuilt libmpv/ANGLE archives referenced by
      # media_kit_libs_windows_video, so this step needs network access.
      - name: Build (release)
        run: flutter build windows --release

      # A Flutter ZIP without the MSVC runtime starts and dies with no window.
      # The shared script copies the release output and the three runtime DLLs;
      # the compatibility job runs the same script so the packages cannot drift.
      - name: Stage release and bundle the MSVC runtime
        shell: pwsh
        run: |
          ../scripts/bundle-msvc-runtime.ps1 `
            -ReleaseDir 'build/windows/x64/runner/Release' `
            -PackageDir (Join-Path $env:RUNNER_TEMP 'ccloud-release\windows')

      - name: Assert the package can start on a clean Windows machine
        shell: pwsh
        run: |
          ../scripts/assert-windows-package.ps1 `
            -PackageDir (Join-Path $env:RUNNER_TEMP 'ccloud-release\windows')

      # The CMake probe that used to gate the compat package is gone on purpose:
      # the wrapper headers it compiled against are only unpacked during the
      # build, so it could only ever answer "unsupported" on a clean runner, and
      # it sat between the assert and the upload, so its crash swallowed the
      # package. windows/CMakeLists.txt now declares the requirement instead.
      - name: Upload portable build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: CCloud-windows-x64
          path: ${{ runner.temp }}/ccloud-release/windows/
          if-no-files-found: error

      # The installer is best effort: a runner without Inno Setup must not turn
      # the whole build red, but the log says clearly that it was skipped. The
      # portable package and its smoke test matter more than the installer, so
      # the step cannot fail the job either - ISCC problems still show up in the
      # step log and the skipped upload.
      #
      - name: Build installer (Inno Setup)
        id: installer
        continue-on-error: true
        shell: pwsh
        run: |
          # 'created' starts out false so that an ISCC crash - which aborts the
          # script before it can write the output - cannot leave the flag unset
          # and look like an intentional skip downstream. It is written from
          # inside this step so it belongs to the same step id the outputs read.
          "created=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          # Version and build come from the canonical version.json interface;
          # this step must not parse pubspec.yaml itself.
          ../scripts/windows-installer.ps1 `
            -ReleaseDir (Join-Path $env:RUNNER_TEMP 'ccloud-release\windows') `
            -OutputDir (Join-Path $env:RUNNER_TEMP 'ccloud-release\installer') `
            -AppVersion '${{ steps.version.outputs.version }}' `
            -Build '${{ steps.version.outputs.build }}'

      - name: Upload installer
        if: steps.installer.outputs.created == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: CCloud-windows-x64-setup
          path: ${{ runner.temp }}/ccloud-release/installer/CCloud-*-setup.exe
          if-no-files-found: error

      - name: Record Windows signing status
        id: signing
        shell: pwsh
        run: |
          "label=unsigned" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Windows signing: unsigned (no Authenticode certificate configured)."

      - name: Package portable ZIP and checksums
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = Join-Path $env:RUNNER_TEMP 'release-staging\windows'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          $zipName = "CCloud-Windows-${{ steps.version.outputs.version }}-${{ steps.version.outputs.build }}.zip"
          $zipPath = Join-Path $stage $zipName
          $package = Join-Path $env:RUNNER_TEMP 'ccloud-release\windows'
          Compress-Archive -Path (Join-Path $package '*') -DestinationPath $zipPath -Force
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $zipPath).Hash.ToLowerInvariant()
          "$hash  $zipName" | Out-File -FilePath (Join-Path $stage 'SHA256SUMS-Windows.txt') -Encoding ascii
          "$hash" | Out-File -FilePath (Join-Path $stage ($zipName -replace '\.zip$', '.sha256')) -Encoding ascii
          # Only copy the installer the compiler step actually reported as
          # created; a failed ISCC can leave a partial setup.exe in the output
          # folder, and that must never become a release asset.
          $installer = $null
          if ('${{ steps.installer.outputs.created }}' -eq 'true') {
            $installer = Get-ChildItem -LiteralPath (Join-Path $env:RUNNER_TEMP 'ccloud-release\installer') `
              -Filter 'CCloud-*-setup.exe' -ErrorAction SilentlyContinue |
              Sort-Object LastWriteTime -Descending | Select-Object -First 1
          }
          if ($installer) {
            Copy-Item -LiteralPath $installer.FullName -Destination $stage -Force
            $installerHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $installer.FullName).Hash.ToLowerInvariant()
            "$installerHash  $($installer.Name)" |
              Out-File -FilePath (Join-Path $stage 'SHA256SUMS-Windows.txt') -Append -Encoding ascii
            "$installerHash" |
              Out-File -FilePath (Join-Path $stage ($installer.Name + '.sha256')) -Encoding ascii
          }
          "unsigned" | Out-File -FilePath (Join-Path $stage 'SIGNING-Windows.txt') -Encoding utf8
          Get-ChildItem -LiteralPath $stage | ForEach-Object { Write-Host $_.Name }

      - name: Upload Windows release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-Windows-${{ steps.version.outputs.version }}-${{ steps.version.outputs.build }}
          path: ${{ runner.temp }}/release-staging/windows/
          if-no-files-found: error

  # Escape hatch for machines whose GPU/driver path keeps Impeller from
  # presenting a frame. This is a separate job on purpose: a failure here must
  # not hide the already-published portable package, the installer or the smoke
  # test. It is no longer gated on a configure-time SDK probe, because that
  # probe cannot work (see windows/CMakeLists.txt) and skipping the package was
  # worse than building it.
  package-windows-compat:
    name: Windows compatibility package (Skia)
    needs: build-windows
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.8'
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build compatibility (release, Impeller disabled)
        shell: pwsh
        run: |
          $env:CCLOUD_FORCE_SKIA = 'ON'
          flutter build windows --release

      - name: Stage compatibility package with the MSVC runtime
        shell: pwsh
        run: |
          ../scripts/bundle-msvc-runtime.ps1 `
            -ReleaseDir 'build/windows/x64/runner/Release' `
            -PackageDir (Join-Path $env:RUNNER_TEMP 'ccloud-release\windows-compat')

      - name: Assert the compatibility package is complete
        shell: pwsh
        run: |
          ../scripts/assert-windows-package.ps1 `
            -PackageDir (Join-Path $env:RUNNER_TEMP 'ccloud-release\windows-compat')

      - name: Upload compatibility build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: CCloud-windows-x64-compat
          path: ${{ runner.temp }}/ccloud-release/windows-compat/
          if-no-files-found: error

      # The renderer escape hatch is only useful if it actually starts, so the
      # same smoke script runs against the staged compatibility folder.
      - name: Launch compatibility ccloud.exe
        shell: pwsh
        run: |
          ../scripts/windows-smoke.ps1 `
            -ReleaseDir (Join-Path $env:RUNNER_TEMP 'ccloud-release\windows-compat') `
            -ScreenshotPath windows-smoke-compat.png

      - name: Upload compatibility run evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-smoke-compat-evidence
          path: flutter_app/windows-smoke-compat.png
          if-no-files-found: warn

  # A successful build only proves the compiler and linker were happy. This job
  # runs the produced binary and requires it to open a visible window titled
  # "CCloud", so a missing libmpv, a bad DLL or a dead embedder turns CI red
  # instead of shipping an exe that cannot start.
  smoke-test:
    name: Windows runtime smoke test
    needs: build-windows
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Download portable build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: CCloud-windows-x64
          path: windows-release

      - name: Launch ccloud.exe
        shell: pwsh
        run: ./scripts/windows-smoke.ps1 -ReleaseDir windows-release -ScreenshotPath windows-smoke.png

      - name: Upload run evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-smoke-evidence
          path: windows-smoke.png
          if-no-files-found: warn

  # The installer is the package the README recommends, yet until now CI only
  # ever compiled it and uploaded it - the portable folder was the thing that
  # actually ran. A setup.exe that installs to the wrong prefix, loses a DLL in
  # the copy step or leaves an exe that cannot start used to ship green. This
  # job installs it silently and repeats the launch smoke test against the
  # installed files.
  installer-smoke:
    name: Windows installer install + smoke test
    needs: build-windows
    if: needs.build-windows.outputs.installer == 'true'
    runs-on: windows-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Download installer
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: CCloud-windows-x64-setup
          path: installer-download

      - name: Install silently and launch the installed app
        shell: pwsh
        run: |
          # The download step lays the artifact out as
          # installer-download/CCloud-Windows-<ver>-<build>-setup.exe, but
          # recurse so a changed upload layout cannot silently produce
          # 'no setup found'.
          $setup = Get-ChildItem -LiteralPath installer-download -Recurse -Filter 'CCloud-*-setup.exe' |
              Sort-Object Length -Descending | Select-Object -First 1
          if (-not $setup) {
              Write-Host "::error::the downloaded artifact holds no CCloud-*-setup.exe"
              Get-ChildItem -LiteralPath installer-download -Recurse | ForEach-Object { Write-Host $_.FullName }
              exit 1
          }
          ./scripts/windows-installer-smoke.ps1 -SetupPath $setup.FullName

      # The app writes %LOCALAPPDATA%\CCloud\startup.log, which windows-smoke.ps1
      # already prints into the job log but does not copy out. Pull it in so the
      # 'renderer: Impeller default/disabled' line BUILD.md promises to show is
      # reviewable from the artifact and not only from a log that expires.
      - name: Collect the installed app log
        if: always()
        shell: pwsh
        run: |
          $log = Join-Path (Join-Path $env:LOCALAPPDATA 'CCloud') 'startup.log'
          if (Test-Path -LiteralPath $log) {
              New-Item -ItemType Directory -Force -Path installer-evidence | Out-Null
              Copy-Item -LiteralPath $log -Destination (Join-Path 'installer-evidence' 'startup.log') -Force
              Write-Host "--- $log ---"
              Get-Content -LiteralPath $log | ForEach-Object { Write-Host "  $_" }
          }
          else {
              Write-Host '::warning::no startup.log was written by the installed binary'
          }

      # windows-smoke.ps1 writes its screenshot relative to the CURRENT WORKING
      # DIRECTORY. This job has no working-directory default, so that is the
      # workspace root and the upload path below matches. Adding a
      # defaults.working-directory here would silently break the evidence upload.
      - name: Upload installed run evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-installer-smoke-evidence
          path: |
            windows-smoke-installed.png
            installer-evidence/
          if-no-files-found: warn
