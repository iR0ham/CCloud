name: Build Windows

# Windows builds cannot be cross-compiled from macOS, so they run on a Windows
# runner. There is no release/publish step: the workflow only produces an
# artifact that can be downloaded and tested.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  analyze:
    name: Dart analyze
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

  build-windows:
    name: Windows release build
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Resolve dependencies
        run: flutter pub get

      # The first run downloads the prebuilt libmpv/ANGLE archives referenced by
      # media_kit_libs_windows_video, so this step needs network access.
      - name: Build (release)
        run: flutter build windows --release

      - name: Upload portable build
        uses: actions/upload-artifact@v4
        with:
          name: CCloud-windows-x64
          path: flutter_app/build/windows/x64/runner/Release/
          if-no-files-found: error

  # A successful build only proves the compiler and linker were happy. This job
  # runs the produced binary and requires it to open a visible window titled
  # "CCloud", so a missing libmpv, a bad DLL or a dead embedder turns CI red
  # instead of shipping an exe that cannot start.
  smoke-test:
    name: Windows runtime smoke test
    needs: build-windows
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download portable build
        uses: actions/download-artifact@v4
        with:
          name: CCloud-windows-x64
          path: windows-release

      - name: Launch ccloud.exe
        shell: pwsh
        run: ./scripts/windows-smoke.ps1 -ReleaseDir windows-release -ScreenshotPath windows-smoke.png

      - name: Upload run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-smoke-evidence
          path: windows-smoke.png
          if-no-files-found: warn
