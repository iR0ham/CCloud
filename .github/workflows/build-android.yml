name: Build Android/TV

# Reusable Android/TV build. One universal release APK is produced (never
# --split-per-abi), so the global versionCode stays exactly the canonical build
# number; an AAB is produced from the same version.
on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to check out; defaults to the caller's ref
        required: false
        type: string
        default: ''
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        required: false
      ANDROID_KEY_ALIAS:
        required: false
      ANDROID_KEY_PASSWORD:
        required: false
    outputs:
      signing:
        description: release-signed or internal-debug-signed
        value: ${{ jobs.build.outputs.signing }}
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to check out; defaults to the selected branch/tag
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: build-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Android/TV universal APK + AAB
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      signing: ${{ steps.signing.outputs.label }}
    defaults:
      run:
        working-directory: flutter_app
    env:
      # Secret names/formats (documented here; values are never committed):
      #   ANDROID_KEYSTORE_BASE64: base64 of the release .jks/.keystore
      #   ANDROID_KEYSTORE_PASSWORD: keystore password
      #   ANDROID_KEY_ALIAS: key alias inside the keystore
      #   ANDROID_KEY_PASSWORD: key password
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true
      # cnativeapi's build hook resolves GTK 3, X11 and Xi through pkg-config.
      - name: Install Linux desktop and native build prerequisites
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            libstdc++-12-dev \
            liblzma-dev \
            libx11-dev \
            libxi-dev \
            libxext-dev \
            libxfixes-dev \
            libxrandr-dev \
            libxrender-dev \
            libxcursor-dev \
            libxinerama-dev \
            libxcomposite-dev \
            libxdamage-dev \
            libxkbcommon-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libegl1-mesa-dev \
            libgles2-mesa-dev \
            libasound2-dev \
            libpulse-dev \
            libwayland-dev \
            libdrm-dev \
            libgbm-dev
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Stage canonical legal Flutter assets
        working-directory: .
        run: python3 scripts/stage_legal.py android
      - name: Sync and validate canonical version
        id: version
        working-directory: .
        run: |
          python3 scripts/version.py sync
          python3 scripts/version.py check
          VERSION="$(python3 scripts/version.py show | python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])')"
          BUILD="$(python3 scripts/version.py show | python3 -c 'import json,sys; print(json.load(sys.stdin)["build"])')"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
      - name: Configure Android signing
        id: signing
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/ccloud-release.jks
            chmod 600 android/app/ccloud-release.jks
            cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=app/ccloud-release.jks
          EOF
            echo "label=release-signed" >> "$GITHUB_OUTPUT"
            echo "Android signing: release-signed (keystore secrets present)."
          else
            echo "label=internal-debug-signed" >> "$GITHUB_OUTPUT"
            echo "::notice::Android signing secrets absent; outputs are internal/debug-signed and are not production releases."
          fi
      - name: Resolve dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Build universal release APK (no split-per-ABI)
        run: flutter build apk --release
      - name: Build release App Bundle
        run: flutter build appbundle --release
      - name: Assert APK identity, version, TV launcher/banner, and activity configuration
        shell: bash
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -f "$APK"
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -z "$SDK" ]; then
            echo "::error::Android SDK environment is missing"
            exit 1
          fi
          APKANALYZER="$(command -v apkanalyzer || true)"
          if [ -z "$APKANALYZER" ]; then
            APKANALYZER="$(find "$SDK/cmdline-tools" -path '*/bin/apkanalyzer' -type f 2>/dev/null | sort -V | tail -1)"
          fi
          if [ -z "$APKANALYZER" ]; then
            echo "::error::apkanalyzer not found"
            exit 1
          fi
          AAPT="$(find "$SDK/build-tools" -name aapt -type f 2>/dev/null | sort -V | tail -1)"
          if [ -z "$AAPT" ]; then
            echo "::error::aapt not found"
            exit 1
          fi
          APP_ID="$("$APKANALYZER" manifest application-id "$APK")"
          VERSION_CODE="$("$APKANALYZER" manifest version-code "$APK")"
          VERSION_NAME="$("$APKANALYZER" manifest version-name "$APK")"
          echo "applicationId=$APP_ID versionName=$VERSION_NAME versionCode=$VERSION_CODE"
          test "$APP_ID" = "com.ccloud.ccloud"
          test "$VERSION_CODE" = "${{ steps.version.outputs.build }}"
          test "$VERSION_NAME" = "${{ steps.version.outputs.version }}"
          MANIFEST="$RUNNER_TEMP/android-manifest.xml"
          BADGING="$RUNNER_TEMP/android-badging.txt"
          # Hosted evidence at 6fb03bf: apkanalyzer decodes the APK manifest from
          # binary resources, so resource references and flag enumerations come back
          # as opaque values (android:banner="@ref/0x7f070077",
          # android:launchMode="1", android:configChanges="0x40003fb4",
          # android:windowSoftInputMode="0x10"). Asserting literal declarations
          # against that rendering can never pass, so the mandatory literal tokens
          # below are asserted against the merged release manifest that aapt2
          # actually compiled into this APK, while the decoded APK manifest still
          # proves every governed attribute survived into the shipped package.
          MERGED=""
          # The fourth path is the one both green hosted runs actually resolved
          # (runs 46087125808 / 46089580637 logged it as the "merged manifest
          # artifact:"), and it was not one of the three explicit candidates, so the
          # selection only ever worked through the fallback. Listing it makes the
          # known AGP layout explicit instead of incidental.
          for candidate in \
            build/app/intermediates/merged_manifests/release/AndroidManifest.xml \
            build/app/intermediates/packaged_manifests/release/AndroidManifest.xml \
            build/app/intermediates/merged_manifest/release/AndroidManifest.xml \
            build/app/intermediates/merged_manifest/release/outputReleaseAppLinkSettings/AndroidManifest.xml; do
            if [ -s "$candidate" ]; then
              MERGED="$candidate"
              break
            fi
          done
          if [ -z "$MERGED" ]; then
            # Narrowed from '*release*' to this module's release merged manifests, and
            # an ambiguous remainder is now a hard failure instead of a sort-order
            # pick: the literal assertions below are only evidence when they run
            # against the manifest that was compiled into this APK.
            mapfile -t MERGED_FALLBACK < <(find build/app/intermediates -type f -path '*/merged_manifest/release/*' -name AndroidManifest.xml 2>/dev/null | sort)
            if [ "${#MERGED_FALLBACK[@]}" -gt 1 ]; then
              echo "::error::the merged-manifest fallback is ambiguous (${#MERGED_FALLBACK[@]} candidates); refusing to assert the literal manifest contract against a guessed artifact"
              printf 'fallback candidate: %s\n' "${MERGED_FALLBACK[@]}"
              exit 1
            fi
            if [ "${#MERGED_FALLBACK[@]}" -eq 1 ]; then
              MERGED="${MERGED_FALLBACK[0]}"
            fi
          fi
          if [ -z "$MERGED" ] || [ ! -s "$MERGED" ]; then
            echo "::error::the release merged AndroidManifest.xml was not found; the literal manifest contract cannot be checked"
            echo "----- intermediate manifest candidates -----"
            find build/app/intermediates -maxdepth 3 -type f -name AndroidManifest.xml 2>/dev/null | sort | head -40 || true
            exit 1
          fi
          echo "merged manifest artifact: $MERGED"
          if ! "$APKANALYZER" manifest print "$APK" > "$MANIFEST"; then
            echo "::error::apkanalyzer manifest print failed; the APK manifest contract cannot be checked"
            exit 1
          fi
          if [ ! -s "$MANIFEST" ]; then
            echo "::error::apkanalyzer manifest print produced an empty manifest"
            exit 1
          fi
          # Every token below stays mandatory. require_token keeps that gate but
          # names the artifact and condition that failed and dumps the checked
          # artifacts, so a hosted run says which contract broke instead of
          # aborting on a silent grep exit (the manifest and badging text contain
          # no secrets).
          require_token() {
            label="$1"
            file="$2"
            token="$3"
            if ! grep -Fq -- "$token" "$file"; then
              echo "::error::$label is missing the expected token: $token"
              echo "----- checked artifact: $file -----"
              cat "$file"
              echo "----- decoded AndroidManifest.xml -----"
              cat "$MANIFEST"
              if [ -s "$BADGING" ]; then
                echo "----- aapt dump badging -----"
                cat "$BADGING"
              fi
              exit 1
            fi
            echo "ok: $label contains $token"
          }
          # Artifact binding, asserted before any contract token. $APP_ID is read
          # from the APK under test, so requiring it in the selected merged manifest
          # proves the literal assertions below run against this package's app
          # module rather than some other release manifest that happens to sit under
          # build/app/intermediates. The decoded manifest is the binary manifest of
          # the same APK, and its package attribute is rendered faithfully (the
          # 6fb03bf failure dump showed `package="com.ccloud.ccloud"`).
          require_token "merged manifest" "$MERGED" "$APP_ID"
          require_token "APK manifest" "$MANIFEST" "package=\"$APP_ID\""
          # Shipped-package contract, asserted where the decoded APK manifest
          # renders the value faithfully:
          require_token "APK manifest" "$MANIFEST" 'android.software.leanback'
          require_token "APK manifest" "$MANIFEST" 'android.intent.category.LEANBACK_LAUNCHER'
          require_token "APK manifest" "$MANIFEST" 'android:banner='
          require_token "APK manifest" "$MANIFEST" 'android:taskAffinity=""'
          require_token "APK manifest" "$MANIFEST" 'android.hardware.touchscreen'
          # The optional-touchscreen contract, not just the feature name. Before this
          # step the assertion above only proved the feature was mentioned, so
          # `android:required="true"` would have passed while a D-pad-only TV could not
          # install the APK. apkanalyzer renders uses-feature values faithfully (the
          # 6fb03bf failure dump showed `android:required="false"` for both features),
          # so the value is asserted here and bound to the feature it governs below.
          require_token "APK manifest" "$MANIFEST" 'android:required="false"'
          # The context window is written to a file first because this step runs under
          # `set -o pipefail`, where a `grep -q` that exits early can SIGPIPE the
          # upstream grep and turn a passing condition into a spurious failure.
          TOUCHSCREEN="$RUNNER_TEMP/android-touchscreen.txt"
          grep -A2 -F 'android:name="android.hardware.touchscreen"' "$MANIFEST" > "$TOUCHSCREEN" || true
          if ! grep -Fq -- 'android:required="false"' "$TOUCHSCREEN"; then
            echo '::error::the shipped package does not pair android.hardware.touchscreen with android:required="false"; a D-pad-only TV cannot install it'
            echo "----- decoded AndroidManifest.xml -----"
            cat "$MANIFEST"
            if [ -s "$BADGING" ]; then
              echo "----- aapt dump badging -----"
              cat "$BADGING"
            fi
            exit 1
          fi
          echo 'ok: APK manifest pairs android.hardware.touchscreen with android:required="false"'
          # Existence of each governed attribute in the shipped package (the value
          # itself is opaque here and is asserted literally further below):
          require_token "APK manifest" "$MANIFEST" 'android:launchMode='
          require_token "APK manifest" "$MANIFEST" 'android:configChanges='
          require_token "APK manifest" "$MANIFEST" 'android:windowSoftInputMode='
          # Orientation/focus/back contract, asserted against the merged manifest
          # that aapt2 compiled into this APK:
          # - the TV banner is the project's own @drawable/tv_banner;
          # - the activity handles orientation/screen-size changes itself, so a
          #   TV/phone rotation does not recreate the Flutter engine;
          # - the soft keyboard resizes instead of panning, which keeps the
          #   focused field visible on a TV/phone;
          # - touchscreen is optional, asserted as
          #   android.hardware.touchscreen + android:required="false" on the shipped
          #   package above, so a D-pad-only TV can install it;
          # - singleTop + empty taskAffinity keep back/relaunch inside this app.
          require_token "merged manifest" "$MERGED" '@drawable/tv_banner'
          require_token "merged manifest" "$MERGED" 'android:launchMode="singleTop"'
          require_token "merged manifest" "$MERGED" 'android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"'
          require_token "merged manifest" "$MERGED" 'android:windowSoftInputMode="adjustResize"'
          # Android TV is landscape, so the launcher activity may not carry any
          # orientation lock. screenOrientation is an enum whose value the decoded
          # manifest cannot name, so the prohibition is that the attribute is
          # absent from the shipped package entirely, and never "portrait" in the
          # merged declaration.
          if grep -Fq 'android:screenOrientation="portrait"' "$MERGED"; then
            echo "::error::the activity must not be locked to portrait; Android TV is landscape"
            cat "$MERGED"
            exit 1
          fi
          if grep -Fq 'android:screenOrientation=' "$MANIFEST"; then
            echo "::error::the shipped package declares an orientation lock; Android TV is landscape"
            cat "$MANIFEST"
            exit 1
          fi
          if ! "$AAPT" dump badging "$APK" > "$BADGING"; then
            echo "::error::aapt dump badging failed; the APK badging contract cannot be checked"
            exit 1
          fi
          require_token "APK badging" "$BADGING" "package: name='com.ccloud.ccloud' versionCode='${{ steps.version.outputs.build }}' versionName='${{ steps.version.outputs.version }}'"
          require_token "APK badging" "$BADGING" 'leanback-launchable-activity'
          require_token "APK badging" "$BADGING" 'banner='
          AAB="build/app/outputs/bundle/release/app-release.aab"
          test -f "$AAB"
          AAB_LIST="$RUNNER_TEMP/aab-list.txt"
          unzip -l "$AAB" > "$AAB_LIST"
          grep -Fq 'base/manifest/AndroidManifest.xml' "$AAB_LIST"
          python3 - "$APK" "$AAB" <<'PY'
          import sys
          import zipfile
          from pathlib import Path

          apk = Path(sys.argv[1])
          aab = Path(sys.argv[2])
          root = Path('..').resolve()
          documents = ('NOTICE', 'THIRD_PARTY_NOTICES.md', 'SOURCES.md')
          licenses = tuple(sorted((root / 'Legal/licenses').glob('*.txt')))
          assert len(licenses) == 10, f'expected 10 canonical licenses, found {len(licenses)}'

          status = root / 'Legal/DISTRIBUTION_STATUS.md'
          expected = [(name, root / name, f'assets/legal/{name}') for name in documents]
          expected.append(
              (status.name, status, 'assets/legal/Legal/DISTRIBUTION_STATUS.md')
          )
          expected.extend(
              (path.name, path, f'assets/legal/Legal/licenses/{path.name}')
              for path in licenses
          )
          for archive, prefix in ((apk, 'assets/flutter_assets/'), (aab, 'base/assets/flutter_assets/')):
              with zipfile.ZipFile(archive) as package:
                  for name, canonical, relative in expected:
                      member = prefix + relative
                      assert member in package.namelist(), f'{archive}: missing {member}'
                      assert package.read(member) == canonical.read_bytes(), (
                          f'{archive}: legal payload differs from canonical source: {member}'
                      )
          print(f'APK/AAB legal assertions passed: {len(expected)} files per package')
          PY
          echo "APK/AAB assertions passed."
      - name: Name and checksum Android artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-artifacts
          LABEL="${{ steps.signing.outputs.label }}"
          APK="CCloud-Android-${{ steps.version.outputs.version }}-${{ steps.version.outputs.build }}-${LABEL}.apk"
          AAB="CCloud-Android-${{ steps.version.outputs.version }}-${{ steps.version.outputs.build }}-${LABEL}.aab"
          cp build/app/outputs/flutter-apk/app-release.apk "release-artifacts/$APK"
          cp build/app/outputs/bundle/release/app-release.aab "release-artifacts/$AAB"
          printf '%s\n' "$LABEL" > release-artifacts/SIGNING-Android.txt
          printf '%s\n' INTERNAL-ONLY-BLOCKED-RELINKING > release-artifacts/DISTRIBUTION-Android.txt
          (cd release-artifacts && sha256sum "$APK" "$AAB" > SHA256SUMS-Android.txt)
          cat release-artifacts/SHA256SUMS-Android.txt
      - name: Upload Android release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-Android-${{ steps.version.outputs.version }}-${{ steps.version.outputs.build }}
          path: flutter_app/release-artifacts/
          if-no-files-found: error
      - name: Remove temporary Android signing material
        if: always()
        shell: bash
        run: |
          rm -f android/key.properties android/app/ccloud-release.jks
