name: CI

# Reusable test workflow plus PR/push/dispatch entry points. Every action is
# pinned to a full commit SHA; update the trailing comment when bumping a tag.
on:
  workflow_call:
    inputs:
      live_api:
        description: Run the live backend verification harness (network access required)
        required: false
        type: boolean
        default: false
      ref:
        description: Git ref to check out; defaults to the caller's ref
        required: false
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      live_api:
        description: Run the live backend verification harness (network access required)
        required: false
        type: boolean
        default: false
      ref:
        description: Git ref to check out; defaults to the selected branch/tag
        required: false
        type: string
        default: ''
  pull_request:
  push:
    branches:
      - main
      - ci/github-first-foundation

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    name: Version and canonical metadata
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Check version metadata
        run: python3 scripts/version.py check
      - name: Run version tests
        run: python3 Tests/test_version.py
      - name: State live API policy
        run: |
          if [ "${{ inputs.live_api }}" = "true" ]; then
            echo "live API checks are enabled for this run"
          else
            echo "::notice::live API checks were not requested (live_api=false)"
          fi

  flutter:
    name: Flutter analyze and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true
      # cnativeapi's build hook resolves GTK 3, X11 and Xi through pkg-config.
      - name: Install Linux desktop and native build prerequisites
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            libstdc++-12-dev \
            liblzma-dev \
            libx11-dev \
            libxi-dev \
            libxext-dev \
            libxfixes-dev \
            libxrandr-dev \
            libxrender-dev \
            libxcursor-dev \
            libxinerama-dev \
            libxcomposite-dev \
            libxdamage-dev \
            libxkbcommon-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libegl1-mesa-dev \
            libgles2-mesa-dev \
            libasound2-dev \
            libpulse-dev \
            libwayland-dev \
            libdrm-dev \
            libgbm-dev
      - name: Stage canonical legal Flutter assets
        working-directory: .
        run: python3 scripts/stage_legal.py android
      - name: Resolve dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test

  macos-typecheck:
    name: macOS arm64 typecheck
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: Assert arm64 runner
        run: |
          ARCH="$(uname -m)"
          echo "runner arch: $ARCH"
          test "$ARCH" = "arm64"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Check version metadata
        run: python3 scripts/version.py check
      - name: Typecheck Swift sources
        run: ./scripts/typecheck.sh

  webos-static:
    name: webOS static JS/JSON/service validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
      - name: Check version metadata
        run: python3 scripts/version.py check
      - name: Check JavaScript syntax
        run: |
          find webos_app/app webos_app/service -name '*.js' -print0 \
            | xargs -0 -r -n1 node --check
      - name: Run webOS transport regressions
        run: node --test Tests/webos/transport.test.js
      - name: Validate webOS JSON and service manifest
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          appinfo = json.loads(Path('webos_app/app/appinfo.json').read_text(encoding='utf-8'))
          service_package = json.loads(Path('webos_app/service/com.ccloud.tv.service/package.json').read_text(encoding='utf-8'))
          services = json.loads(Path('webos_app/service/com.ccloud.tv.service/services.json').read_text(encoding='utf-8'))
          assert appinfo['id'] == 'com.ccloud.tv', appinfo
          assert appinfo['version'], appinfo
          assert service_package['name'] == 'com.ccloud.tv.service'
          assert service_package['main'] == 'ccloud_service.js'
          service_js = Path('webos_app/service/com.ccloud.tv.service/ccloud_service.js')
          assert service_js.is_file()
          service_text = service_js.read_text(encoding='utf-8')
          assert "service.register('fetch'" in service_text
          assert "service.register('ping'" in service_text
          entries = services.get('services')
          assert isinstance(entries, list) and entries, services
          match = next((entry for entry in entries if entry.get('name') == 'com.ccloud.tv.service'), None)
          assert match is not None, services
          commands = {command.get('name') for command in match.get('commands', [])}
          assert {'fetch', 'ping'} <= commands, match
          PY
      - name: Assert the dev server is outside the package roots
        run: |
          if find webos_app/app webos_app/service -name server.js -print -quit | grep -q .; then
            echo "::error::server.js must not be part of the webOS app/service package"
            exit 1
          fi
      - name: Assert generated version.js matches canonical metadata
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          canonical = json.loads(Path('version.json').read_text(encoding='utf-8'))
          text = Path('webos_app/app/js/version.js').read_text(encoding='utf-8')
          assert f'window.CCLOUD_VERSION = "{canonical["version"]}";' in text
          assert f'window.CCLOUD_BUILD = "{canonical["build"]}";' in text
          PY

  live-api:
    name: Live API verification
    if: inputs.live_api
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: Assert arm64 runner
        run: |
          ARCH="$(uname -m)"
          echo "runner arch: $ARCH"
          test "$ARCH" = "arm64"
      - name: Run the live backend harness
        run: ./Tests/api/run.sh
      - name: Upload API evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: live-api-evidence
          path: Tests/api/out/verify.log
          if-no-files-found: warn
