<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#0a0b10">
  <title>CCloud</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="splash"><img src="assets/img/logo.png" alt="CCloud" class="splash-logo"><div class="splash-spinner"></div></div>
  <div id="app"></div>

  <!-- Generated from version.json by scripts/version.py; must load before app code. -->
  <script src="js/version.js"></script>
  <script src="js/util.js"></script>
  <script src="js/net.js"></script>
  <script src="js/api.js"></script>
  <script src="js/store.js"></script>
  <!--
    Multi-source foundation (tasks B2-J, B3-J, B4-2). The order is the contract: contracts before parser
    before identity before catalog before the built-in adapter, with the persistence seam last because it
    calls into the other four. `Tests/webos/live_catalog_store.test.js` fails if this page loads them in a
    different order, omits one, or if a module exists on disk that no page loads. Nothing consumes them
    until task B4-3 switches the live screen over, so this block changes what the device has available, not
    what it shows.
  -->
  <script src="js/playlist_contracts.js"></script>
  <script src="js/playlist_parser.js"></script>
  <script src="js/channel_identity.js"></script>
  <script src="js/unified_catalog.js"></script>
  <script src="js/builtin_catalog_adapter.js"></script>
  <script src="js/live_catalog_store.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/feed.js"></script>
  <script src="js/player.js"></script>
  <script src="js/screens/home.js"></script>
  <script src="js/screens/browse.js"></script>
  <script src="js/screens/search.js"></script>
  <script src="js/screens/countries.js"></script>
  <script src="js/screens/detail.js"></script>
  <script src="js/screens/live.js"></script>
  <script src="js/screens/library.js"></script>
  <script src="js/screens/settings.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
